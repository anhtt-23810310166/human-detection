<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLOv8 Human Detection</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-dot"></div>
                <h1>Hệ Thống An Ninh YOLOv8</h1>
            </div>
            <div class="system-time" id="systemTime">00:00:00</div>
        </header>

        <main class="main-content">
            <!-- Khu vực Video -->
            <div class="camera-card">
                <div class="video-wrapper">
                    <video id="webcam" autoplay playsinline></video>
                    <!-- Overlay Canvas để vẽ khung đỏ (Bounding Box) đè lên video -->
                    <canvas id="overlayCanvas"></canvas>
                    
                    <!-- Canvas ẩn để trích xuất ảnh gửi cho AI -->
                    <canvas id="captureCanvas" style="display: none;"></canvas>
                    
                    <div class="scan-line" style="display: none;"></div>
                </div>
                <div class="camera-footer">
                    <span class="cam-name">CAM-02 (YOLOv8 Core)</span>
                    <button id="toggleEngineBtn" class="action-btn">BẬT AI ENGINE</button>
                </div>
            </div>

            <!-- Khu vực Trạng thái -->
            <div class="status-card">
                <h2>Trạng Thái Hiện Tại</h2>
                <div id="statusIndicator" class="status-indicator">
                    <div class="status-icon" id="statusIcon">🛡️</div>
                    <div class="status-text" id="statusText">Hệ thống đang chờ...</div>
                </div>

                <div class="logs-wrapper">
                    <h3>Nhật ký hoạt động</h3>
                    <ul id="logList">
                        <li>Hệ thống sẵn sàng.</li>
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
