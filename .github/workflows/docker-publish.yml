name: CI/CD Docker Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Lấy Source Code từ GitHub về
      - name: 📥 Tải Source Code (Checkout)
        uses: actions/checkout@v4

      # 2. Đăng nhập vào Docker Hub bằng Tài khoản Bí mật
      - name: 🔑 Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      # 3. Đóng gói & Bắn chiếc hộp Backend lên Mây
      - name: 🚀 Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/human-detection-backend:latest
          
      # 4. Đóng gói & Bắn chiếc hộp Frontend lên Mây
      - name: 🚀 Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/human-detection-frontend:latest
