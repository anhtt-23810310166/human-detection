version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: human_detection_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: human_detection_api
    ports:
      - "8080:8080"
    restart: always
    volumes:
      - ./backend:/app
    depends_on:
      - mongodb
    environment:
      - MONGODB_URL=mongodb://mongodb:27017

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: human_detection_ui
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend

volumes:
  mongodb_data:
